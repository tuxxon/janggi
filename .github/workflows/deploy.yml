# GitHub Pages 배포: 테스트 → 빌드 → dist 게시.
# 지금은 수동 실행만 켠다. 저장소를 touchizen/janggi 로 옮기고 Pages(소스: GitHub Actions)를 켠 뒤 push 트리거를 연다.
name: Deploy to GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # npm install 스크립트가 도는 단계에는 배포 권한을 주지 않는다
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run
      - run: npm run build
      - name: 신경망(.nnue)을 재배포하지 않는다
        run: test -z "$(find dist -name '*.nnue' -o -name 'dev-nnue')"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
